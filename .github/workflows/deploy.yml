name: Deploy to Cloudflare Pages

# Вариант B (DTP_Analytics_new_data_update_deploy.md), GitHub Release Asset.
# Код-деплой при push в main. Build идущий до deploy может отменяться
# (быстрые пуши), а финальный deploy разделён на отдельный job с общим
# mutex "cf-pages-deploy" — чтобы не деплоить одновременно с weekly.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: code-build
  cancel-in-progress: true

permissions:
  contents: read # для скачивания release asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download data snapshot (asset data-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p web/public/data
          gh release download data-latest \
            -R ${{ github.repository }} \
            --pattern 'data-latest.tar.gz' \
            --clobber || {
              echo "::error:: Релиз data-latest или ассет не найден. Запусти сначала weekly workflow (workflow_dispatch update-data)."
              exit 1
            }
          tar -xzf data-latest.tar.gz -C web/public/data
          rm -f data-latest.tar.gz

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: |
          npm i -g npm@11.12.0 --no-audit --no-fund
          npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Production build (base=/ для Cloudflare)
        working-directory: web
        env:
          CF_PAGES: "1"
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: cf-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: web/dist

      - name: Install wrangler (закреплённая версия)
        run: npm i -g wrangler@4.100.0 --no-audit --no-fund

      - name: Deploy web/dist to Cloudflare Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name dtp-analytics \
            --branch main
