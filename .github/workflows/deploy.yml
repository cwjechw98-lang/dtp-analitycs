name: Deploy to Cloudflare Pages

# Вариант B (DTP_Analytics_new_data_update_deploy.md), GitHub Release Asset.
# Код-деплой при push в main: скачать готовый ассет data-latest (без полного
# data pipeline), собрать сайт и задеплоить в Cloudflare Pages.
# Если ассета ещё нет — шаг смотрится и workflow падает с понятной ошибкой.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: code-deploy
  cancel-in-progress: true

permissions:
  contents: read # для скачивания release asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download data snapshot (asset data-latest)
        run: |
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases/tags/data-latest --jq '.id' 2>/dev/null || echo "")
          if [ -z "$RELEASE_ID" ]; then
            echo "::error:: Релиз data-latest не найден. Запусти сначала weekly workflow (или workflow_dispatch update-data)."
            exit 1
          fi
          gh api repos/${{ github.repository }}/releases/$RELEASE_ID/assets \
            --jq '.[] | select(.name=="data-latest.tar.gz") | .url' \
            | xargs -I{} curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" {} -o data-latest.tar.gz
          mkdir -p web/public/data
          tar -xzf data-latest.tar.gz -C web/public/data
          rm -f data-latest.tar.gz

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: |
          npm i -g npm@11.12.0 --no-audit --no-fund
          npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Production build (base=/ для Cloudflare)
        working-directory: web
        env:
          CF_PAGES: "1"
        run: npm run build

      - name: Install wrangler (закреплённая версия)
        run: npm i -g wrangler@4.100.0 --no-audit --no-fund

      - name: Deploy web/dist to Cloudflare Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name dtp-analytics \
            --branch main
