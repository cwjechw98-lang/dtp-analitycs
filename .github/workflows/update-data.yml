name: Weekly data update

on:
  schedule:
    - cron: "0 4 * * 1" # каждый понедельник в 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: pip install -r requirements.txt

      - name: Download all regions from dtp-stat.ru
        working-directory: pipeline
        run: python download_all.py

      - name: Build datasets for the site
        working-directory: pipeline
        run: python build_all.py

      - name: Commit refreshed data
        run: |
          git config user.name "dtp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/public/data
          git diff --cached --quiet && echo "NO_CHANGES" || git commit -m "data: еженедельное обновление (все регионы РФ)"
          git push
