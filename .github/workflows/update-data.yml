name: Weekly data update → Cloudflare Pages

# Схема из DTP_Analytics_new_data_update_deploy.md (Вариант B, GitHub Release Asset).
# Weekly: скачать данные → build_all → упаковать web/public/data → обновить
# asset data-latest в служебном release → собрать сайт → Pages deploy.
# Данные НЕ коммитятся в main. Временная машина уничтожается.

on:
  schedule:
    - cron: "0 4 * * 1" # каждый понедельник в 04:00 UTC
  workflow_dispatch:

concurrency:
  group: data-deploy
  cancel-in-progress: false

permissions:
  contents: write # для обновления release asset

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: pip install -r requirements.txt

      - name: Download all regions from dtp-stat.ru
        working-directory: pipeline
        run: python download_all.py

      - name: Build datasets
        working-directory: pipeline
        run: python build_all.py

      - name: Package data snapshot
        run: |
          cd web/public/data
          tar -czf "$RUNNER_TEMP/data-latest.tar.gz" .

      - name: Upload data snapshot to GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: data-latest
          name: "Data snapshot (latest)"
          body: "Служебный release: готовый набор данных из web/public/data для деплоя без пересборки."
          files: "${{ runner.temp }}/data-latest.tar.gz"
          allow_updates: true
          overwrite: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: |
          npm i -g npm@11.12.0 --no-audit --no-fund
          npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Production build (base=/ для Cloudflare)
        working-directory: web
        env:
          CF_PAGES: "1"
        run: npm run build

      - name: Install wrangler (закреплённая версия)
        run: npm i -g wrangler@4.100.0 --no-audit --no-fund

      - name: Deploy web/dist to Cloudflare Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name dtp-analytics \
            --branch main
